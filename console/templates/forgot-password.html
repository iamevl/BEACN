<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>Forgot password · BEACN</title>

  {% include '_theme_bootstrap.html' %}

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/auth.css') }}?v={{ app_version }}"
  >
</head>

<body>

  <main class="auth-shell">

    <section class="auth-card">

      <div class="auth-brand">
        <div class="auth-logo">B</div>

        <div>
          <strong>BEACN</strong>
          <span>Network Intelligence</span>
        </div>
      </div>

      <div class="auth-heading">
        <h1>Reset password</h1>

        <p>
          Enter the recovery email address associated with your
          BEACN account.
        </p>
      </div>

      {% if message %}
        <div class="auth-success">
          {{ message }}
        </div>
      {% endif %}

      <form method="post">

        <input
          type="hidden"
          name="_csrf"
          value="{{ auth_csrf_token }}"
        >

        <label>
          Recovery email

          <input
            type="email"
            name="email"
            autocomplete="email"
            required
            autofocus
          >
        </label>

        <button type="submit">
          Send reset link
        </button>

      </form>

      <p class="auth-footer-link">
        <a href="{{ url_for('auth_login') }}">
          Back to sign in
        </a>
      </p>

    </section>

  </main>

  <script src="{{ url_for('static', filename='js/theme.js') }}?v={{ app_version }}"></script>

</body>
</html>
