services:
  beacn:
    build:
      context: .
    image: local/beacn:1.0
    container_name: beacn
    restart: unless-stopped
    network_mode: host
    environment:
      NETWORK_SUBNET: "192.168.1.0/24"
      APP_PORT: "8766"
      IPERF_PORT: "5201"
      DATA_DIR: "/data"
      AGENT_TIMEOUT: "20"
      METRICS_INTERVAL_SECONDS: "15"
      TELEMETRY_RETENTION_DAYS: "30"
      TELEMETRY_MAX_POINTS: "1000"
      DOCKER_MONITORING_ENABLED: "true"
      DOCKER_TIMEOUT_SECONDS: "5"
      TZ: "Europe/London"
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cap_add:
      - NET_RAW
      - NET_ADMIN
