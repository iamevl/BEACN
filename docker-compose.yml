name: beacn-console

services:
  beacn-console:
    build:
      context: .
      dockerfile: console/Dockerfile
    image: local/beacn-console:1.0
    container_name: beacn-console
    restart: unless-stopped
    network_mode: host

    environment:
      NETWORK_SUBNET: "${NETWORK_SUBNET:?Set NETWORK_SUBNET in .env to the IPv4 CIDR BEACN is authorised to monitor}"
      APP_PORT: "8766"
      IPERF_PORT: "5201"
      DATA_DIR: "/data"
      AGENT_TIMEOUT: "20"
      AGENT_DOCKER_TIMEOUT: "90"
      METRICS_INTERVAL_SECONDS: "15"
      TELEMETRY_RETENTION_DAYS: "30"
      TELEMETRY_MAX_POINTS: "1000"
      DOCKER_MONITORING_ENABLED: "true"
      DOCKER_TIMEOUT_SECONDS: "5"
      # Production is served through HTTPS. Override to false only
      # for intentional direct HTTP development access.
      BEACN_SESSION_COOKIE_SECURE: "${BEACN_SESSION_COOKIE_SECURE:-true}"
      TZ: "Europe/London"

      # Optional SNMP enrichment.
      # Values come from the local .env file and are never
      # committed to source control.
      BEACN_SNMP_ENABLED: "${BEACN_SNMP_ENABLED:-false}"
      BEACN_SNMP_VERSION: "${BEACN_SNMP_VERSION:-3}"
      BEACN_SNMP_USERNAME: "${BEACN_SNMP_USERNAME:-}"
      BEACN_SNMP_AUTH_PASSWORD: "${BEACN_SNMP_AUTH_PASSWORD:-}"
      BEACN_SNMP_PRIV_PASSWORD: "${BEACN_SNMP_PRIV_PASSWORD:-}"
      BEACN_SNMP_COMMUNITY: "${BEACN_SNMP_COMMUNITY:-}"
      BEACN_SNMP_CACHE_TTL_SECONDS: "${BEACN_SNMP_CACHE_TTL_SECONDS:-300}"

    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro

    cap_add:
      - NET_RAW
      - NET_ADMIN
